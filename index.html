<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a121b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest?v=1.0.1"><link rel="apple-touch-icon" href="icon-192.png?v=1.0.1"><link rel="icon" href="icon-192.png?v=1.0.1"><link rel="stylesheet" href="style.css?v=1.0.2"><title>Diário Treino</title><link rel="stylesheet" href="evolution.css?v=1.0.2"><script src="evolution.js?v=1.0.2" defer></script><script src="app.js?v=1.0.2" defer></script></head><body>
<header><div class="wrap head"><img class="logo" src="icon-192.png?v=1.0.1" alt=""><div><strong>Diário Treino</strong><small>Seu treino, no seu ritmo.</small></div><button id="theme" class="ghost" type="button">Tema</button></div></header>
<main class="wrap"><nav aria-label="Área do app"><button id="workoutTab" aria-pressed="true">Treinar</button><button id="historyTab" aria-pressed="false">Histórico</button><button id="evolutionTab" aria-pressed="false">Evolução</button></nav><div id="panel"></div><p id="status" role="status"></p></main><footer class="wrap">Seus registros ficam neste aparelho. Exporte um backup antes de limpar os dados ou trocar de celular.</footer>
<dialog id="exerciseSubstitution" aria-labelledby="substitutionTitle" aria-describedby="substitutionHelp">
 <form id="substitutionForm">
  <h2 id="substitutionTitle">Trocar exercício</h2>
  <p class="note">Na ficha: <strong id="substitutionOriginal"></strong></p>
  <p class="note" id="substitutionHelp">A troca vale só para a data e ficha selecionadas. A meta de séries da ficha não muda.</p>
  <label class="field">Nome nesta sessão <input type="text" id="substitutionName" maxlength="100" required autocomplete="off" placeholder="Ex.: Remada curvada"></label>
  <p class="note" id="substitutionError" role="status"></p>
  <div class="substitution-actions"><button class="primary" type="submit">Usar nesta sessão</button><button id="substitutionCancel" type="button">Cancelar</button><button id="substitutionDefault" type="button" hidden>Voltar ao exercício da ficha</button></div>
 </form>
</dialog>
</body></html>
